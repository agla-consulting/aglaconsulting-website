<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 230" width="100%" height="100%">
  <style>
    .bg { fill: #0f172a; }
    .text-white { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 800; }
    .text-cyan { fill: #00f0ff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 800; }
    .text-sub { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 900; letter-spacing: 0.02em; }
  </style>
  
  <!-- Background Slate Area (Remove rect for transparent background) -->
  <rect class="bg" width="100%" height="100%" rx="12" />

  <!-- Centered Graphic Group -->
  <g text-anchor="middle">
    <!-- Main AGLA Brand Name (Size: 94px) -->
    <text x="275" y="92" font-size="94" class="text-white" letter-spacing="-0.02em">AG<tspan class="text-cyan">LA</tspan></text>
    
    <!-- CONSULTING Sub-header (Size: 80px) -->
    <text x="275" y="172" font-size="80" class="text-sub">CONSULTING</text>
  </g>
</svg>